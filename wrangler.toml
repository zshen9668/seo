# Cloudflare Pages 配置（免费档）
# 文档: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# 本地预览: npm run pages:dev
# 部署:     npm run pages:deploy
#
# 密钥不要写在本文件，用控制台或:
#   npx wrangler pages secret put ZHIPU_API_KEY --project-name=seo-pilot

name = "seo-pilot"
compatibility_date = "2025-10-01"
pages_build_output_dir = "dist"

# 非敏感默认值（密钥请用 Secret / 控制台 Environment variables）
[vars]
# 部署后改为你的 Pages 域名，OAuth 回调依赖此值（也可在控制台覆盖）
# APP_URL = "https://seo-pilot.pages.dev"

# ---------- 以下仅作变量名清单，真实值请在 CF 控制台配置为 Secret ----------
# AUTH_DEMO_EMAIL
# AUTH_DEMO_PASSWORD
# GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
# ZHIPU_API_KEY / SILICONFLOW_API_KEY / GEMINI_API_KEY / GROQ_API_KEY
# DEEPSEEK_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY
# DASHSCOPE_API_KEY / MOONSHOT_API_KEY
# CUSTOM_LLM_BASE_URL / CUSTOM_LLM_API_KEY
